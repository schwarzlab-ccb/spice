directories:
  data_dir: 'data'
  results_dir: 'results'
  log_dir: 'logs'
  plot_dir: 'plots'

params:
  # Base RNG seed. Every random draw in SPICE derives from it (see spice/random_state.py), so the
  # same seed on the same input reproduces a run; change it to get an independent replicate.
  # Overridable per command with --seed. Caveats: wall-clock limits (time_limit_*) and an unset
  # PYTHONHASHSEED can still make runs differ.
  seed: 42
  # Logging
  logging_level: "INFO"
  # Input data
  total_cn: False # Set to True for total copy-number mode
  # Preprocessing
  wgd_inference_method: 'major_cn' # can be 'major_cn' or 'ploidy_loh'
  # Top-level parameters
  skip_existing: False # Test whether output files already exist and skip computation if so
  # Thresholds for number of events
  dist_limit: 40 # Maximum number of events to consider
  full_path_dist_limit: 9 # Above this number of events, do not attempt full path finding
  full_path_high_mem_dist_limit: 8 # Needed for cluster execution using Snakemake
  # Function parameters
  use_cache: True
  sv_size_filter: 1000
  sv_matching_threshold: 10
  knn_k: 250
  all_loh_solutions: False
  mcmc_max_T: -6
  mcmc_min_T: 1
  mcmc_n_iterations_scale: 200
  # Runaway ceilings for the large_chroms MCMC. Both default to None (off) = historical behaviour;
  # when either fires the unit raises McmcGuardExceeded, which _run_batch records in
  # failed_reports.tsv, so one pathological unit costs one unit instead of the whole chunk.
  # mcmc_max_iterations: refuse a unit whose derived budget (n_events * mcmc_n_iterations_scale)
  #   exceeds this. Guards hyper-fragmented chromosomes buying an enormous budget.
  # mcmc_loh_solve_time_limit: seconds per CP-SAT solve in the proposal-time LOH filters, which are
  #   otherwise UNBOUNDED (every sibling call site uses 1s). This is the ceiling that catches a
  #   trajectory wedged inside ONE solve -- how CNSistent chunk_0024 reached ~73 GB and SIGSEGV'd
  #   without finishing a single iteration. NB setting it makes results wall-clock dependent (see the
  #   time_limit_* caveat above), but a hit is REPORTED rather than silently answered, so a run either
  #   reproduces or tells you which unit it gave up on.
  mcmc_max_iterations: null
  mcmc_loh_solve_time_limit: null
  # Time limits (in seconds, per chromosome)
  time_limit_all_solutions: null
  time_limit_mcmc: null
  skip_loh_check_for_large_chroms: True # Whether to skip LOH checks for large chromosomes when MCMC solving times out (can lead to inaccurate results, but might be necessary for large chromosomes)
  # Cluster parameters for Snakemake
  knn_mem: 16000
  full_path_mem: 16000
  full_path_mem_large: 64000
  full_path_disk: 16000 # needed for caching of paths

loci_detection:
  # De-novo loci detection parameters
  loci_steps: 'fast' # Steps to run: 'full', 'fast', combine, single step, or space-separated steps
  N_loci: 100 # Number of loci to detect per chromosome (flat; ignored when N_loci_spacing is set)
  N_loci_spacing: null # If set, seed one locus per this many bp of searchable sequence (padded telomere span minus padded centromere) instead of the flat N_loci, so the candidate density is comparable across chromosomes
  skip_up_down: False # Skip up/down assignment
  use_original_rank: False # Use original rank from detection instead of re-ranking
  N_bootstrap: 10 # Number of bootstrap samples for signal bootstrap
  N_kernel: 1000 # Number of kernel samples for convolution kernel and height multiplier
  overwrite_preprocessing: False # Force recalculation of preprocessing caches (bootstrap signals, data_per_length_scale)
  detection_blocked_distance_th: 200000 # Blocked distance threshold (in bp)
  # N_iterations parameters for pipeline steps
  detection_N_iterations_base: 30 # Base number of iterations for detection
  detection_max_N_iterations: 200 # Maximum iterations for detection
  detection_final_N_iterations: 250 # Final iterations for detection
  ranking_N_iterations: 5 # Number of iterations for ranking loci
  flipping_N_iterations: 110 # Number of iterations for flipping
  flipping_N_iterations_single: 10 # Number of iterations for single flips
  limiting_N_iterations_optim: 100 # Number of iterations for limiting optimization
  optimizing_N_iterations_optimization: 110 # Number of iterations for optimization
  infer_widths_N_iterations: 10 # Number of optimization iterations for widths
  merge_N_iterations_optim: 100 # Number of iterations for merge optimization
  within_ci_N_iterations: 100 # Number of iterations for within ci filtering
  filter_N_iterations_optim: 100 # Number of iterations for filter optimization
  final_limiting_N_iterations_optim: 100 # Number of iterations for final limiting optimization
  N_bootstrap_for_widths: 10 # How many bootstrap iterations are used for inferring locus widths (needs to be <= N_bootstrap)
  th_locus_prominence: 10 # Threshold for locus prominence filtering
  # Loci assignment
  loci_assignment_N_iterations: 250 # Number of iterations for loci assignment optimization
  loci_assignment_within_ci_N_iterations: 100 # Number of iterations for within ci filtering
  # Loci combination and scoring parameters
  p_values_N_random: 1000 # Number of random samples for p-value calculation
  p_values_N_iterations: 1000 # Number of optimization iterations for p-value calculations
  calculate_p_value: True # Whether to calculate p-values from scratch (if False, load from cache)
  p_value_threshold: 0.05 # Loci with q_value (BH-FDR fitness p) >= this are dropped from the output
  p_values_mode: 'top' # How resimulation loci are chosen for p-value calculation ('random' or 'top')
  p_values_optimize_ls_separately: False # Only used when p_values_mode='top'. If True, each length scale gets its own top-residual position and is optimized separately, instead of jointly optimizing one shared position
  p_values_within_ci_filtering: False # If True, ablate each resim locus like detection's within_ci_filtering ablates the observed loci (zeroing a length scale the signal does not need), so the null's fitness is measured the same way the observed fitness is
  # Event preprocessing parameters
  remove_plateaus: True # Remove events overlapping copy-number plateaus
  remove_chrY: True # Remove chrY events from analysis
  drop_duplicates: True # Remove duplicate event entries
  use_observed_centromeres: True # Use empirically observed centromere positions
